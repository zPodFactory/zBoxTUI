# systemd drop-in for getty@tty6.service
#
# Install path: /etc/systemd/system/getty@tty6.service.d/override.conf
#
# Effect: tty6 auto-logs root and launches /usr/local/bin/zboxtui as
# the "login program", so switching to tty6 (Ctrl+Alt+F6 at the host
# console) lands directly in the DCUI. tty1-tty5 keep their regular
# getty so there's always a recovery shell available.

[Service]
# Wipe the inherited ExecStart from the agetty template; then set our
# own. The leading dash in the second ExecStart tells systemd to
# ignore a non-zero exit code (so a zboxtui crash doesn't take the
# whole unit into a failed state — Restart= handles re-launching it).
ExecStart=
ExecStart=-/sbin/agetty --autologin root --login-program /usr/local/bin/zboxtui --noclear --keep-baud %I 38400 linux

# zboxtui is the only thing this tty does. If it exits, bring it back
# straight away so the operator always sees the DCUI on tty6.
Restart=always
RestartSec=1

# Run with a fresh process group so signals from the parent agetty
# don't leak; keep StandardInput/Output bound to the tty (systemd's
# default for getty@.service already does this — listed here for
# clarity).
StandardInput=tty
StandardOutput=tty
TTYReset=yes
TTYVHangup=yes

# Hardening: zboxtui needs to read /proc, run hostnamectl, write to
# /etc/hostname + /etc/hosts, restart networking. It needs to *be*
# root. So we don't drop privileges — but we still pin everything
# else that doesn't matter.
PrivateTmp=yes
ProtectSystem=full
# /etc must stay writable for hostname / network edits.
ReadWritePaths=/etc /var/log
# Network configuration is the whole point — don't restrict it.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
NoNewPrivileges=no
